name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sample-host/package-lock.json
      - name: Check public npm dependency age (library)
        env:
          NPM_RELEASE_AGE_DAYS: '3'
        run: node scripts/check-npm-release-age.mjs
      - name: Check public npm dependency age (sample host)
        env:
          NPM_RELEASE_AGE_DAYS: '3'
        working-directory: sample-host
        run: node ../scripts/check-npm-release-age.mjs
      - run: npm ci
      # The sample host is a separate package; the contract tests and the client's
      # protocol tests use it, so install it before running the checks.
      - run: npm ci
        working-directory: sample-host
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sample-host/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: sample-host
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # Real Next.js, React Router, Vue, Nuxt, SvelteKit, Angular and Astro apps built against
  # the packed library (examples/), driven in Chromium against the sample collector.
  examples:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sample-host/package-lock.json
            examples/*/package-lock.json
      - name: Check public npm dependency age (examples)
        env:
          NPM_RELEASE_AGE_DAYS: '3'
        run: |
          for lock in examples/*/package-lock.json; do
            echo "== $lock"
            (cd "$(dirname "$lock")" && node ../../scripts/check-npm-release-age.mjs)
          done
      - run: npm ci
      - run: npm ci
        working-directory: sample-host
      - run: npx playwright install --with-deps chromium
      - name: Build the example apps
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          ASTRO_TELEMETRY_DISABLED: '1'
          NG_CLI_ANALYTICS: 'false'
        run: npm run examples:build
      - run: npm run test:examples
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples
          path: |
            playwright-report/examples/
            test-results/
