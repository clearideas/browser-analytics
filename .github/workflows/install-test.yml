name: Test Public Package Installation

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org/
      - run: npm install @clearideas/analytics
